<!doctype html>
<!-- PROTOTYPE, throwaway (issue #20 "Story share card design").
     Three variants of a story's share card in the Kinetic default theme, switchable via ?variant=A|B|C and the floating
     bar. Every card comes from one builder (card.js) fed by the story's facts (facts.js); real data from
     ../report-fixture.json, never committed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype: story share cards</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f9; --surface: #ffffff; --fg: #17181c; --muted: #61646e; --border: #e1e2e8; --soft: #eef0f6;
  --accent: #4f5bd5; --accent-fg: #ffffff;
  --c1: #4f5bd5; --c2: #d6409f; --c3: #1f9d63; --c4: #d48a00; --c5: #0e8fc7;
  --ink: #17181c; --paper: #ffffff;
  --on-c1: #ffffff; --on-c2: #ffffff; --on-c3: #17181c; --on-c4: #17181c; --on-c5: #17181c;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111216; --surface: #191a20; --fg: #ecedf1; --muted: #9a9daa; --border: #2c2e37; --soft: #22242c;
    --accent: #8790ff; --accent-fg: #0d0e14; --c1: #8790ff; --c2: #f070b8; --c3: #4cc98c; --c4: #f2b33d; --c5: #4cbcf0;
    --ink: #0d0e14; --on-c1: #0d0e14; --on-c2: #0d0e14; --on-c3: #0d0e14; --on-c4: #0d0e14; --on-c5: #0d0e14; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); padding-bottom: 90px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
header.top { height: 56px; display: flex; align-items: center; border-bottom: 1px solid var(--border); }
header.top strong { font-size: 16px; }
h1 { font-size: 22px; font-weight: 600; margin: 20px 0 12px; }

/* controls: the share popover's toggles, plus the owner's own "show sample marks" */
.tools { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: saturate(1.4);
  display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.tog { display: inline-flex; gap: 8px; align-items: center; min-height: 34px; cursor: pointer; }
.tog input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.tools .lbl { color: var(--muted); font-size: 13px; }

/* one row per story */
.story { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 640px) minmax(240px, 1fr); gap: 20px; align-items: start;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin: 16px 0; }
.story h2 { grid-column: 1 / -1; margin: 0; font-size: 18px; font-weight: 600; }
.story h2 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
[data-shape="tall"] .story { grid-template-columns: minmax(0, 360px) minmax(240px, 1fr); }
[data-shape="wide"] .story { grid-template-columns: minmax(0, 760px) minmax(240px, 1fr); }
@media (max-width: 900px) { .story, [data-shape] .story { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; }
figcaption { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 6px; }
figcaption button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; }
.cardwrap { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--border); }
.cardwrap canvas { display: block; width: 100%; height: auto; }
/* real text over the canvas: each word a button where the canvas drew it */
.hit { position: absolute; border: 0; padding: 0; margin: 0; background: transparent; color: transparent; cursor: pointer; border-radius: 4px;
  overflow: hidden; white-space: nowrap; font-size: 1px; }
.hit:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 0 0 2px var(--accent); }
.hit:focus-visible { outline-offset: 0; }
.show-hits .hit { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent); }

.post { font-size: 15px; }
.post .lbl { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.post-text { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--bg); line-height: 1.7; }
.post-text button { border: 0; background: transparent; padding: 0 1px; border-radius: 3px; cursor: pointer; }
.post-text button:hover { background: var(--soft); }
.post-text button[aria-pressed="true"] { letter-spacing: -.05em; }
.post-text .cta { color: var(--muted); }
.post .facts { color: var(--muted); font-size: 13px; margin-top: 10px; }

/* prototype switcher: not part of the design */
.proto { position: fixed; left: 50%; bottom: 10px; translate: -50% 0; z-index: 50; display: flex; align-items: center; gap: 6px;
  padding: 5px 6px; border-radius: 999px; background: #000; color: #fff; font: 12px/1.2 var(--mono); box-shadow: 0 6px 24px #0008; white-space: nowrap; max-width: calc(100vw - 12px); }
.proto button { background: #fff2; border: 0; color: #fff; border-radius: 999px; min-width: 30px; height: 30px; padding: 0 10px; cursor: pointer; font: inherit; }
.proto .p-name { font-weight: 700; padding: 0 4px; }
.proto .p-state { opacity: .8; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 600px) { .proto { font-size: 10px; padding: 3px; } .proto button { height: 26px; min-width: 26px; padding: 0 7px; } }
@media (prefers-reduced-motion: no-preference) { .hit, .post-text button { transition: background-color 120ms, box-shadow 120ms; } }
</style>
</head>
<body>
<header class="top"><div class="wrap"><strong>Discord Wrapped</strong></div></header>
<main class="wrap">
  <h1>Story share cards</h1>
  <div class="tools" role="group" aria-label="Card options">
    <span class="seg" data-param="shape" role="group" aria-label="Card shape"><button data-v="both">Both</button><button data-v="tall">9:16</button><button data-v="wide">16:9</button></span>
    <span class="seg" data-param="result" role="group" aria-label="Guess result"><button data-v="mix">Mixed guesses</button><button data-v="right">All right</button><button data-v="wrong">All wrong</button><button data-v="skip">Skipped</button></span>
    <span class="seg" data-param="period" role="group" aria-label="Period"><button data-v="2025">2025</button><button data-v="2020">2020</button><button data-v="all">All time</button></span>
    <label class="tog"><input type="checkbox" data-tog="names">Hide names</label>
    <label class="tog"><input type="checkbox" data-tog="quotes">Hide quotes</label>
    <label class="tog"><input type="checkbox" data-tog="sample">Show sample marks</label>
    <label class="tog"><input type="checkbox" data-tog="hits">Outline tap targets</label>
  </div>
  <div id="gallery"></div>
</main>
<div class="proto" role="toolbar" aria-label="Prototype variants">
  <button type="button" class="p-prev" aria-label="Previous variant">←</button>
  <span class="p-name"></span><span class="p-state"></span>
  <button type="button" class="p-next" aria-label="Next variant">→</button>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
